services:
  mysql:
    image: mysql:8.4
    container_name: movie-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moviedb
      MYSQL_USER: movieuser
      MYSQL_PASSWORD: moviepassword

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: